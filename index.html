<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha-Login</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <main>
    <form action="" id="formulario">
        <h1>Loginha-Login</h1>
        <p>
            <label for="nome"> Nome:
                <input type="text" id="nome" class="inputo" placeholder="Eudes Donizete">
            </label>
        </p>
        <p>
            <label for="email">
                E-mail: <input type="email" name="" id="email" class="inputo" placeholder=" EudesSampaio@gmail.com" minlength="8" maxlength="20" aria-required="true">
            </label>
        </p>

        <p>
            <label for="senha">
                Senha: <input type="password" name="" id="senha" class="inputo" placeholder="******************" max="8" required>
            </label>
        </p>
        <input type="button" value="Logar" class="inputo" id="bota" onclick="logar()">    
    </form>
    </main>
   <script src="login.js"></script>
</body>

</html>
